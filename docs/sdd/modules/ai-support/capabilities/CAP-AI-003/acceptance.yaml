schemaVersion: '0.2'
capabilityId: CAP-AI-003
specVersion: 0.3.0
status: rules-accepted-awaiting-implementation
executable: false
note: 本轮未执行新AC；历史测试不能冒充本版本结果。
scenarios:
- id: AC-AI-003-01
  name: 本人状态
  references:
  - REQ-AI-003-01
  - REQ-AI-003-02
  - REQ-AI-003-04
  given: 有效买家有本人普通订单
  when: 查询明确编号
  then: 仅返回该单匿名实时状态和查询时间，不写交易
  result: not-run
- id: AC-AI-003-02
  name: 身份拒绝
  references:
  - REQ-AI-003-01
  given: 匿名、停用、非买家或他人会话
  when: 查询订单或混合请求
  then: 按认证／会话契约整轮拒绝，不执行工具、不写成功轮次
  result: not-run
- id: AC-AI-003-03
  name: 纯查询不可见
  references:
  - REQ-AI-003-01
  - REQ-AI-003-02
  given: 外人或不存在编号
  when: 仅查询该编号
  then: 两种情况同404和ORDER_NOT_QUERYABLE，不回退其他订单、不提交成功轮次
  result: not-run
- id: AC-AI-003-04
  name: 范围及分页
  references:
  - REQ-AI-003-02
  given: 本人不同日期、不同状态订单超过20笔
  when: 查询recent、日期或all并下一页
  then: recent最多3，all每页最多20，上海首尾日期包含；未隐藏本人全部状态，不猜有效含义
  result: not-run
- id: AC-AI-003-05
  name: 新追问与重放
  references:
  - REQ-AI-003-03
  - REQ-AI-003-06
  given: 已有成功结果，订单状态后来变化
  when: 同ID重试或新请求追问
  then: 同ID回放原业务结果；新追问重查，均做安全投影
  result: not-run
- id: AC-AI-003-06
  name: 三类型
  references:
  - REQ-AI-003-04
  given: 普通、试单、预售及缺失子记录
  when: 读取状态
  then: 按交易域类型解释，未知明确未知，不猜付款退款或写状态
  result: not-run
- id: AC-AI-003-07
  name: 最小投影
  references:
  - REQ-AI-003-01
  - REQ-AI-003-05
  given: 输入中有英文编号、PII及伪造权限
  when: 走模型、响应、历史及遥测
  then: 真实标识与凭据不出私有边界，任意工具和owner被拒绝
  result: not-run
- id: AC-AI-003-08
  name: 并发与冲突
  references:
  - REQ-AI-003-06
  given: 相同请求或旧revision并发
  when: 提交完整／部分结果
  then: 幂等不重复轮次，同ID不同内容及旧revision409，结果原子保存
  result: not-run
- id: AC-AI-003-09
  name: 必要业务故障
  references:
  - REQ-AI-003-07
  given: 订单库或必要会话服务不可用
  when: 查询纯订单
  then: 503且不提交成功轮次，不用历史或模型补事实
  result: not-run
- id: AC-AI-003-10
  name: 页面错误
  references:
  - REQ-AI-003-08
  given: 有历史、部分完成、失败和分页
  when: 恢复、重试、切换账号
  then: 按screen-spec区分状态，保留可重试输入，无账号串读
  result: not-run
- id: AC-AI-003-11
  name: 只读与提示注入
  references:
  - REQ-AI-003-01
  - REQ-AI-003-05
  - REQ-AI-003-08
  given: 用户或知识包含支付／写库／SQL指令
  when: 执行订单工具
  then: 固定白名单只读，订单、库存、支付无变动
  result: not-run
- id: AC-AI-003-12
  name: 可选与明确偏好
  references:
  - REQ-AI-003-07
  given: 偏好库不可用而订单库可用
  when: 普通订单、普通知识、普通推荐及明确偏好任务
  then: 前三者按实际依赖完成，普通推荐明示未用偏好；明确偏好任务失败而不伪装无偏好
  result: not-run
- id: AC-AI-003-13
  name: 独立及依赖任务
  references:
  - REQ-AI-003-09
  given: 订单A不可查询且有独立绿茶介绍和依赖A步骤
  when: 执行有序计划
  then: 介绍可完成，A统一not_queryable，依赖步骤skipped，200 partial且保存真实任务状态；纯订单仍404
  result: not-run
- id: AC-AI-003-14
  name: 当前页位置
  references:
  - REQ-AI-003-02
  - REQ-AI-003-03
  given: 本人页内20项映射存在，之后有新订单插入
  when: 询问第二笔、过期或伪造页位置
  then: 第二笔仍指展示时同一订单并重查；跨会话、失效、歧义澄清，不重新排序猜测
  result: not-run
- id: AC-AI-003-15
  name: 部分结果回放
  references:
  - REQ-AI-003-06
  - REQ-AI-003-09
  given: 已保存部分完成轮次
  when: 同ID同内容、改内容、恢复历史
  then: 不重复工具或轮次；变更内容冲突，失败步骤不成为成功订单或偏好事实
  result: not-run
