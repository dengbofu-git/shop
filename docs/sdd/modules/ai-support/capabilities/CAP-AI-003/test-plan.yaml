completionCriteria:
  - 当前全部 AC 均有可执行测试或明确人工验收步骤，覆盖版本一致。
  - 对象隔离、伪造身份、无效引用、敏感泄漏、重放与并发的定向用例通过。
  - 他人／不存在订单统一 404；偏好库失败 503 且无成功轮次，不能只测成功路径。
  - 真实模型验收与隔离回归分开记录；模型样例范围内无跨用户泄漏、交易写入或编造当前状态。
  - 延迟和可用性阈值在目标环境确认，不用历史均值代替正式指标。
  - 证据记录规格版本、实现提交及未提交内容哈希、环境配置、命令结果、覆盖 AC、时间和限制。
  - API错误码及页面状态有一一对应，不通过中文answer猜分支；旧服务端/旧前端兼容行为有定向验证。
  - 脱敏语法在解析和替换之间一致，完整响应、历史、重放和遥测各有反向断言；静态schema检查不能替代这些运行断言。
