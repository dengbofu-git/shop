schemaVersion: "0.1"
capabilityId: CAP-CAT-004
specVersion: "0.1.1"
basePath: /v1/goods
authentication: Authorization头使用现有JWT，可带Bearer前缀；仅活跃customer。
identity: 用户仅由JWT决定；不接受任何owner字段作为归属依据。
response:
  success: {code: 200, data: object-or-array}
  error: {code: http-status, error: message}
  listItem: [skuid, product_name, name, caption, price, image_url, is_launched, is_favorite, recorded_at]
  price: 当前SKU人民币十进制字符串
  recorded_at: ISO8601带时区；收藏时间或最近查看时间
  paginator: {page: positive-integer, pages: positive-integer, pagesize: 12, total: nonnegative-integer}
  privateCache: no-store
endpoints:
  - path: /favorites
    methods: {GET: 本人收藏分页列表}
  - path: /favorites/{sku_id}
    methods:
      GET: 查询本人是否收藏，data.is_favorite为布尔值；无记录包括不存在SKU时为false
      PUT: 幂等收藏已上架SKU；data.is_favorite=true；不要求请求体
      DELETE: 幂等取消本人收藏；data.is_favorite=false
  - path: /recent
    methods: {GET: 本人足迹分页列表, DELETE: 清空本人足迹，data为空对象}
  - path: /recent/{sku_id}
    methods:
      POST: 成功显示有效详情后调用；去重置顶并裁剪至100件；data为空对象
      DELETE: 幂等删除单件本人足迹；data为空对象
pagination: 两个列表接受page正整数，默认1；非法值400，超末页回末页；空列表page=pages=1。
errors:
  400: page不是正整数
  401: Token缺失、无效、过期、用户不存在或账号停用
  403: 非customer账号
  404: PUT收藏或POST足迹的SKU不存在或已下架
  405: 不支持的方法，附带Allow头
compatibility:
  - GET /detail/{id} 的data新增is_launched，既有字段保留。
  - 收藏入口myCollect.html由重定向改为实际页面；新增recent.html。
  - 列表GET、状态GET不会隐式写入足迹。
