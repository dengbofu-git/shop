# 业务域是规则归属；不要求按此重组 Django App。
modules:
  - id: MOD-IAM
    slug: identity
    name: 身份与访问
    stage: REGISTERED
    owner: null
    capabilityIds: [CAP-IAM-001, CAP-IAM-002, CAP-IAM-003]
    boundary: 身份、资料地址、角色权限及对象级访问规则；消费者仍需执行对象过滤。
  - id: MOD-CAT
    slug: catalog-content
    name: 商品与内容
    stage: REGISTERED
    owner: null
    capabilityIds: [CAP-CAT-001, CAP-CAT-002, CAP-CAT-003, CAP-CAT-004]
    boundary: 商品可售事实、商家商品维护、已发布资讯的登录态阅读；库存变动归 FUL，现有库存读口径尚不统一。
  - id: MOD-TRD
    slug: trade
    name: 交易与支付
    stage: REGISTERED
    owner: null
    capabilityIds: [CAP-TRD-001, CAP-TRD-002, CAP-TRD-003]
    boundary: 购物车结算、订单类型与状态、可信支付确认；不拥有物流事实。
  - id: MOD-FUL
    slug: fulfillment
    name: 库存与物流
    stage: REGISTERED
    owner: null
    capabilityIds: [CAP-FUL-001, CAP-FUL-002]
    boundary: 库存、预留释放扣减、仓库、物流及轨迹的事实和变更契约。
  - id: MOD-MER
    slug: merchant-operations
    name: 商家经营
    stage: REGISTERED
    owner: null
    capabilityIds: [CAP-MER-001, CAP-MER-002, CAP-MER-003]
    boundary: 商家履约协作、经营指标和结算展示；订单状态及库存规则引用 TRD/FUL。
  - id: MOD-CUS
    slug: customs
    name: 9710 与溯源
    stage: REGISTERED
    owner: null
    capabilityIds: [CAP-CUS-001]
    boundary: 报关资料、申报、回执与溯源的候选业务；当前仅确认演示资产。
  - id: MOD-AI
    slug: ai-support
    name: 智能客服与 Agent 运营
    stage: REGISTERED
    owner: null
    capabilityIds: [CAP-AI-001, CAP-AI-002, CAP-AI-003, CAP-AI-004]
    boundary: 受控任务编排、推荐表达、证据问答、本人订单查询和模型运营；不拥有交易或商品事实。
  - id: MOD-KNOW
    slug: knowledge-memory
    name: 知识与偏好
    stage: REGISTERED
    owner: null
    capabilityIds: [CAP-KNOW-001, CAP-KNOW-002]
    boundary: 显式买家偏好、知识可见范围、向量空间、召回及重排序。
  - id: MOD-PLAT
    slug: platform
    name: 平台与交互支撑
    stage: REGISTERED
    owner: null
    capabilityIds: [CAP-PLAT-001, CAP-PLAT-002, CAP-PLAT-003]
    boundary: 运营用户管理、共用页面外壳、环境和交付；聚合展示不复制领域规则。

# primaryBusinessModule 是本次规划归属，不修改实现版本登记的 paths。
implementationModuleMapping:
  - {implementationModule: core, primaryBusinessModule: MOD-PLAT}
  - {implementationModule: users, primaryBusinessModule: MOD-IAM}
  - {implementationModule: goods, primaryBusinessModule: MOD-CAT}
  - {implementationModule: carts, primaryBusinessModule: MOD-TRD}
  - {implementationModule: orders, primaryBusinessModule: MOD-TRD, relatedBusinessModules: [MOD-CUS, MOD-MER, MOD-AI]}
  - {implementationModule: pays, primaryBusinessModule: MOD-TRD}
  - {implementationModule: news, primaryBusinessModule: MOD-CAT}
  - {implementationModule: inventory, primaryBusinessModule: MOD-FUL}
  - {implementationModule: logistics, primaryBusinessModule: MOD-FUL}
  - {implementationModule: supplier, primaryBusinessModule: MOD-MER, relatedBusinessModules: [MOD-TRD, MOD-FUL]}
  - {implementationModule: admin_panel, primaryBusinessModule: MOD-PLAT, relatedBusinessModules: [MOD-AI]}
  - {implementationModule: support_ai, primaryBusinessModule: MOD-AI}
  - {implementationModule: ai_storage, primaryBusinessModule: MOD-KNOW}
  - {implementationModule: web, primaryBusinessModule: MOD-PLAT, relatedBusinessModules: [MOD-IAM, MOD-CAT, MOD-TRD, MOD-FUL, MOD-MER, MOD-CUS, MOD-AI]}

