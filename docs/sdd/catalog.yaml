schemaVersion: "0.1"
project: dadashop
updatedAt: "2026-10-16"
documentStatus: proposed
mappingStatus: initial-source-map
mappingComplete: false
implementationReconciliation:
  date: "2026-10-16"
  report: docs/sdd/reconciliation.md
  evidence: docs/sdd/evidence/2026-10-16-sdd-reconciliation/manifest.json
  scope: 全部24个能力的源码核对；运行验证限于登记测试/探针，不等于全量业务验收。
