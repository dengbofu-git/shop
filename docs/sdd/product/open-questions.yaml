- id: Q-012
  status: partially-resolved
  question: 订单状态与创建日期可以发给哪些模型服务，日志、会话、监控的保留期和访问主体是什么？
  affectedCapabilities:
  - CAP-AI-003
  - CAP-AI-004
  - CAP-KNOW-001
  - CAP-KNOW-002
  affectsWork: 对应切片的业务规则确认；不阻断无关维护
  decisionOwner: dengbofu
  recommendation: 延续应用层脱敏和最少字段；模型不见身份或真实订单号；不要默认历史真实模型调用授权持续有效。
  resolveWith: 允许发送的数据字段、模型边界、访问／保留／删除策略和定向泄漏验收。
  resolutions:
  - capabilityId: CAP-AI-003
    status: resolved
    confirmedBy: dengbofu
    confirmedOn: '2026-10-16'
    decision: 允许现有模型服务接收脱敏问题、必要脱敏历史、匿名订单标签、状态和创建日期；身份、真实订单号、地址和联系方式禁止发送。
  remainingScope: 其他能力的模型数据范围仍独立确认；各类持久化数据的保留/删除/访问策略转入 Q-013；不扩大为新服务商或真实数据回放授权。
