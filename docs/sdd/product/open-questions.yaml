  decisionOwner: dengbofu
  recommendation: 按任务必要依赖判断；请求级身份和会话越权整体拒绝；任务级错误不得泄露对象存在性。
  resolveWith: 错误语义、对用户可见文案和状态码、重试及会话写入策略。
  resolution:
    confirmedBy: user
    confirmedOn: '2026-10-23'
    decision: R01：订单／普通知识不依赖偏好，普通推荐缺少可选偏好须提示；明确按保存偏好推荐必须读取成功。R02：纯不可查询订单404；混合请求独立任务可部分完成，依赖任务跳过，无可提交结果的必要技术失败503。
