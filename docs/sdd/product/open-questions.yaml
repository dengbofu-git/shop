  - CAP-AI-003
  - CAP-TRD-002
  affectsWork: 对应切片的业务规则确认；不阻断无关维护
  decisionOwner: dengbofu
  recommendation: 近期最多3笔；all每页最多20笔；独立创建日期筛选使用上海时区且包含首尾；有效订单含义不明时澄清。
  resolveWith: 本人多订单、明确订单、过期引用、试单与预售示例及认可结果。
  resolutions:
  - capabilityId: CAP-AI-003
    status: resolved
    confirmedBy: user
    confirmedOn: '2026-10-23'
    decision: 保留已确认recent3／all20及独立日期范围；R09增加当前展示页位置映射、24小时上限和每次重新鉴权，具体保存方案待评审。
  remainingScope: 完整交易生命周期仍未确认；私有位置映射设计、访问与清理转入Q-011/Q-013，不以分页存在证明序号追问完成。
- id: Q-003
  status: resolved
  question: 外人或不存在订单采用什么统一提示；模型、MySQL、偏好 PostgreSQL 不可用时如何响应及保留会话？
