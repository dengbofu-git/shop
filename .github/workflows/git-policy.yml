name: Git policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: Git policy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Governance regression tests
        run: python -m unittest discover -s tools/tests -p 'test_git_policy.py' -v
      - name: Namespace and module ownership regression tests
        run: python -m unittest tools.tests.test_project_identity tools.tests.test_module_versions -v
      - name: PR policy and exact source checks
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/git_policy.py message --text "$PR_TITLE"
          BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          python tools/git_policy.py verify --base "$BASE" --head "$HEAD_SHA" --branch "$PR_BRANCH"
      - name: Main integration checks
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python tools/git_policy.py verify --base "$BASE_SHA" --head "$HEAD_SHA" --branch codex/ci-integration

  django-runtime:
    name: Django runtime
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_PASSWORD: ci-synthetic-postgresql-only
          POSTGRES_DB: unified_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d unified_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.5-alpine
        ports: ['6379:6379']
    env:
      DJANGO_SECRET_KEY: ci-synthetic-runtime-tests-only
      JWT_SECRET_KEY: ci-synthetic-jwt-runtime-tests-only
      DB_USER: unused_fixture
      DB_PASSWORD: unused_fixture
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: unused_fixture
      TEA_SAAS_PG_TEST_PORT: '5432'
      TEA_SAAS_PG_TEST_PASSWORD: ci-synthetic-postgresql-only
      CART_TEST_REDIS_URL: redis://127.0.0.1:6379/2
      ADMIN_INITIAL_PASSWORD: ci-synthetic-migration-fixture
      SUPPORT_API_KEY: synthetic-never-call-provider
      SUPPORT_MODEL: synthetic
      SUPPORT_BASE_URL: http://127.0.0.1:9
      ALIPAY_PAY_URL: http://127.0.0.1:9
      ALIPAY_APP_ID: synthetic
      ALIPAY_APP_PRIVATE_KEY: unused-fixture.pem
      ALIPAY_APP_NOTIFY_URL: http://testserver/payment-fixture
      FRONTEND_BASE_URL: http://testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-py313.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked application dependencies
        run: python -m pip install -r requirements.txt
      - name: Isolated configuration and migration checks
        run: |
          python manage.py check --settings=tea_saas.pg_test_settings
          python manage.py makemigrations --check --dry-run --settings=tea_saas.pg_test_settings
      - name: Synthetic business and Agent regressions
        run: python manage.py test orders inventory pays carts goods supplier engagement users support_ai ai_storage logistics --settings=tea_saas.pg_test_settings --noinput
