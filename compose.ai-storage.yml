name: tea_saas-ai-storage

services:
  ollama:
    image: ollama/ollama:0.40.4-rocm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AI_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AI_POSTGRES_NAME:-tea_saas_ai}
      POSTGRES_USER: ${AI_POSTGRES_USER:-tea_saas_ai}
      POSTGRES_PASSWORD: ${AI_POSTGRES_PASSWORD:?Set AI_POSTGRES_PASSWORD in .env.postgres}
    ports:
      - "127.0.0.1:${AI_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/001-vector.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
    name: ${AI_POSTGRES_VOLUME_NAME:-tea_saas-ai-storage_postgres_data}
  ollama_models:
    name: ${AI_OLLAMA_VOLUME_NAME:-tea_saas-ai-storage_ollama_models}
