<body data-reservation-mode="create" class="ds-page-payment ds-theme buyer-workbench checkout-page storefront-page" id="buyer-body">
    <div class="buyer-layout">
        {% include 'buyer_sidebar.html' with active='cart' fixed_currency=True %}

        <main class="buyer-main">
            {% include 'buyer_header.html' %}

            <div class="buyer-content storefront-content">
                <div class="storefront-page-head">

                    <h1 class="storefront-page-title">支付订单</h1>

        </ul>
    </div>

        <div id="container" class="clearfix">
            <!-- 支付订单信息-->
            <div class="pay_info">
                <b>订单金额：<i id="total_amount"></i></b>
                <span id="order_id"></span> <span id="saller"></span> <input type="hidden" name="orderId" />
            </div>
            <!--支付方式-->
            <div id="pay_type">
                <!-- 支付方式头-->
                <div class="pay_type_title">
                    <b>支付宝支付</b>
                </div>
                <div id="dnBank">

                </div>

            </div>
            <!--结算条-->

<!-- {#                    剩余付款时间：<b>15：00</b>#} -->
                    <!--获取待支付时间并更改订单状态-->

                <span class="okPay" id="pay_now"><a href="#">确认支付</a></span>
