<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账号安全 · 茶企工作台</title>
    <link href="../static/css/design-tokens.css" rel="stylesheet">
    <link href="../static/css/supplier-workbench.css" rel="stylesheet">
    <link href="../static/css/buyer-account.css?v=20261003-supplier" rel="stylesheet">
    <link rel="icon" href="../static/images/index/py.ico">
    <script src="../static/js/init.js"></script>
    <script src="../static/js/auth-storage.js"></script>
    <script src="../static/js/jquery-3.1.1.min.js"></script>
    <script>
        if (window.location.search.indexOf('embed=1') >= 0 || window.self !== window.top) {
            document.documentElement.classList.add('embed-mode');
        }
    </script>
    <style>
        html.embed-mode body { margin: 0; background: #f1f8e9 !important; }
        .supplier-account-wrap { padding: 20px 24px 32px; max-width: 960px; margin: 0 auto; }
        .supplier-account-back { margin-bottom: 12px; }
        .supplier-account-back a { color: #2e7d32; font-size: 14px; text-decoration: none; font-weight: 600; }
        html.embed-mode .supplier-account-back { display: none; }
    </style>
</head>
<body class="merchant-body supplier-account-page ba-password-page">
    <div class="supplier-account-wrap">
        <p class="supplier-account-back"><a href="merchant_dashboard.html">← 返回工作台首页</a></p>
        <div class="ba-page-head">
            <span class="ba-eyebrow">SUPPLIER WORKBENCH</span>
            <h1>账号安全</h1>
            <p>修改登录密码，保障茶企账户安全。</p>
        </div>
        <section class="ba-panel active">
            <form id="password-form" novalidate>
                <div class="ba-form-row">
                    <label for="pwd-old">当前密码</label>
                    <input type="password" id="pwd-old" minlength="6" maxlength="12" required autocomplete="current-password">
                </div>
                <div class="ba-form-row">
                    <label for="pwd-new">新密码</label>
                    <input type="password" id="pwd-new" minlength="6" maxlength="12" required autocomplete="new-password">
                    <p class="ba-hint">6–12 位字符</p>
                </div>
                <div class="ba-form-row">
                    <label for="pwd-confirm">确认新密码</label>
                    <input type="password" id="pwd-confirm" minlength="6" maxlength="12" required autocomplete="new-password">
                </div>
                <div class="ba-actions">
                    <button type="submit" class="ba-btn-primary">保存新密码</button>
                    <a class="ba-btn-link" href="supplier_profile.html" id="link-profile">返回个人信息</a>
                </div>
                <p class="ba-msg" id="password-msg" aria-live="polite"></p>
            </form>
        </section>
    </div>
    <script src="../static/js/buyer-password.js?v=20261003-supplier"></script>
    <script>
        (function () {
            if (window.location.search.indexOf('embed=1') >= 0) {
                var q = '?embed=1';
                var lp = document.getElementById('link-profile');
                if (lp) lp.href = 'supplier_profile.html' + q;
            }
        })();
    </script>
</body>
</html>
