{% load static %}
<!DOCTYPE html>
<html lang="zh" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tea_saas · 茶叶采购与经营协作</title>
    <meta name="description" id="page-description" content="以茶为媒，连接好生意。在 tea_saas 发现茶品、协作订单，与智能助手一起找到适合的好茶。">
    <meta name="theme-color" content="#185c3b">
    <link href="{% static 'css/theme.css' %}" rel="stylesheet">
    {% include "shared/system_theme.html" %}
    <link href="{% static 'css/login-portal.css' %}?v=20261019-tea-culture" rel="stylesheet">
    <link rel="preload" as="image" href="{% static 'images/tea_saas/login-tea-hero.png' %}">
    <script src="{% static 'js/init.js' %}"></script>
    <script src="{% static 'js/auth-storage.js' %}?v=20261018-session-isolation"></script>
</head>
<body class="ds-page-login ds-theme login-portal-page tea-login">
    <div class="portal-layout">
        <aside class="brand-panel" id="brand-panel" aria-labelledby="brand-heading">
            <div class="brand-hero">
                <img src="{% static 'images/tea_saas/login-tea-hero.png' %}" alt="晨雾茶山间的青瓷盖碗与一盏清茶" data-i18n-alt="hero_alt" class="hero-bg-img" width="1536" height="1024" fetchpriority="high">
                <div class="brand-shade" aria-hidden="true"></div>
            </div>
            <div class="brand-content">
                <div class="brand-slogan-wrap">
                    <p class="brand-eyebrow" data-i18n="hero_eyebrow">茶有源 · 合作无界</p>
                    <h1 class="brand-slogan" id="brand-heading" data-i18n="slogan">一叶好茶，连接每一份用心。</h1>
                    <p class="brand-slogan-sub" data-i18n="slogan_sub">从茶园到茶杯，让采购更从容，让合作更有温度。</p>
                </div>
                <div class="brand-bottom">
                    <p class="scene-caption" data-i18n="scene_caption">山间一叶，杯中万千。</p>
                    <div class="highlight-cards">
                        <div class="highlight-card"><span class="card-index" aria-hidden="true">01</span><span class="card-text" data-i18n="highlight1">发现好茶</span></div>
                        <div class="highlight-card"><span class="card-index" aria-hidden="true">02</span><span class="card-text" data-i18n="highlight2">协同经营</span></div>
                        <div class="highlight-card"><span class="card-index" aria-hidden="true">03</span><span class="card-text" data-i18n="highlight3">智能选茶</span></div>
                    </div>
                </div>
            </div>
        </aside>
        <main class="login-panel" id="login-panel">
            <div class="login-content">
                <div class="login-header">
                    <div class="brand-lockup">
                        <img src="{% static 'images/tea_saas/tea_saas-logo.png' %}" alt="tea_saas 茶芽与茶盏标志" data-i18n-alt="logo_alt" class="portal-logo" width="64" height="64">
                        <div><p class="portal-title" data-i18n="logo_text">tea_saas</p><p class="brand-tagline" data-i18n="brand_tagline">茶叶采购与经营协作</p></div>
                    </div>
                    <div class="lang-switcher" role="group" aria-label="Language">
                        <button type="button" class="lang-btn active" data-lang="zh" lang="zh" aria-pressed="true">中文</button>
                        <button type="button" class="lang-btn" data-lang="en" lang="en" aria-pressed="false">EN</button>
                        <button type="button" class="lang-btn" data-lang="ar" lang="ar" aria-pressed="false">العربية</button>
                    </div>
                </div>
                <div class="welcome-copy">
                    <p class="welcome-eyebrow" data-i18n="welcome_eyebrow">从这里，开启茶的旅程</p>
                    <h2 data-i18n="welcome_title">欢迎回来</h2>
                    <p data-i18n="welcome_desc">登录你的账号，继续发现好茶与新的合作。</p>
                </div>
                <form id="login-form" class="login-form">
                    <div class="input-field">
                        <label for="username" data-i18n="placeholder_username">账号</label>
                        <input type="text" name="username" id="username" required autocomplete="username" autocapitalize="none" spellcheck="false">
                    </div>
                    <div class="input-field">
                        <div class="password-label"><label for="password" data-i18n="placeholder_password">密码</label></div>
                        <input type="password" name="password" id="password" required minlength="6" autocomplete="current-password">
                    </div>
                    <div id="showResult" class="error-msg" role="alert" aria-live="polite"></div>
                    <button type="submit" class="btn-login" data-i18n="btn_login">进入工作台</button>
                    <p class="access-note" data-i18n="access_note">登录后，根据账号权限进入对应工作台。</p>
                </form>
                <div class="login-footer">
                    <p><span data-i18n="register_hint">初次来到这里？</span> <a href="register_sms.html" data-i18n="register">创建账号</a></p>
                    <p class="platform-desc" data-i18n="platform_desc">让好茶被发现，让合作更简单。</p>
                </div>
            </div>
        </main>
    </div>
    <script src="{% static 'js/jquery-3.1.1.min.js' %}"></script>
    <script src="{% static 'js/login-portal.js' %}?v=20261019-account-auth"></script>
</body>
</html>
