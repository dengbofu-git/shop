<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>库存查看 - tea_saas</title>
    <link href="../static/css/index.css" rel="stylesheet" />
    <link href="../static/css/theme.css" rel="stylesheet" />
    <link href="../static/css/merchant_workbench.css" rel="stylesheet" />
    <style>
        /* 确保品牌标题样式生效 */
        .merchant-header-brand {
            max-width: 1200px !important;
            margin: 20px auto !important;
            padding: 20px !important;
            text-align: center !important;
        }
        .brand-container {
            display: inline-flex !important;
            align-items: center !important;
            gap: 12px !important;
            padding: 16px 32px !important;
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(241,248,233,0.95)) !important;
            border-radius: 12px !important;
            box-shadow: 0 4px 20px rgba(27,94,32,0.15), 0 0 0 1px rgba(46,125,50,0.1), inset 0 1px 0 rgba(255,255,255,0.8) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            transition: all 0.3s ease !important;
            animation: brandEntrance 0.6s ease-out !important;
        }
        .brand-title {
            font-size: 28px !important;
            font-weight: 700 !important;
            color: #2e7d32 !important;
            letter-spacing: 2px !important;
        }
        .brand-separator {
            font-size: 24px !important;
            color: #81c784 !important;
            opacity: 0.6 !important;
        }
        .brand-subtitle {
            font-size: 22px !important;
            font-weight: 600 !important;
            color: #558b2f !important;
            letter-spacing: 1px !important;
        }
        @keyframes brandEntrance {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script src="../static/js/init.js"></script>
    <script src="../static/js/auth-storage.js?v=20261018-session-isolation"></script>
    <script src="../static/js/jquery-3.1.1.min.js"></script>
{% include "shared/system_theme.html" %}
</head>
<body class="ds-page-merchant_inventory ds-theme merchant-body">
    <header class="merchant-header-brand">
        <div class="brand-container">
            <img src="../static/images/logo/1.jpg" alt="tea_saas" class="brand-logo-img" />
            <span class="brand-separator">·</span>
            <span class="brand-subtitle">供应商工作台</span>
        </div>
    </header>

    <div class="merchant-wrap">
        <nav class="merchant-nav">
            <ul>
                <li><a href="merchant_dashboard.html">工作台首页</a></li>
                <li><a href="merchant_products.html">添加商品</a></li>
                <li><a href="merchant_orders.html">订单管理</a></li>
                <li><a href="merchant_inventory.html" class="active">库存查看</a></li>
                <li><a href="#" id="btn-logout">退出登录</a></li>
            </ul>
        </nav>
        <div class="merchant-content">
            <h3>我的库存</h3>
            <form id="reservation-policy" style="padding:16px;border:1px solid #d7e5da;border-radius:12px;margin:16px 0;display:grid;gap:12px;max-width:650px">
                <strong>本店待付款库存保护</strong>
                <label>预留时长（秒，60～900） <input name="ttl_seconds" type="number" min="60" max="900" required></label>
                <label>每买家累计待付数量 <input name="max_unpaid_quantity" type="number" min="1" max="100000" required></label>
                <label>每买家累计待付金额（CNY） <input name="max_unpaid_amount" type="number" min="1" max="10000000" step="0.01" required></label>
                <label>单次采购占实物库存上限（%） <input name="max_stock_percent" type="number" min="1" max="100" required></label>
                <small>超限买家需先联系商家确认。规则只影响新订单；平台累计限额及冷却规则仍生效。库存修改不能低于已预留数量。</small>
                <button type="submit" disabled>保存库存保护规则</button><p id="reservation-policy-status" role="status"></p>
            </form>
            <div id="inventory-list"><div class="empty-tip">加载中...</div></div>
        </div>
    </div>

    <footer class="merchant-footer">tea_saas · 中国地标茶出海中东 © 2026</footer>

    <script>
        var token = AuthStorage.getToken();
        if (!token) {
            alert('请先登录');
            location.href = 'login.html';
        } else {
        $('#btn-logout').click(function(e) {
            e.preventDefault();
            AuthStorage.clear();
            location.href = 'login.html';
        });

        $.ajax({
            url: baseUrl + '/v1/supplier/inventory',
            dataType: 'json',
            headers: { 'Authorization': token },
            success: function(r) {
                if (r.code === 200) {
                    var list = r.data || [];
                    if (list.length === 0) $('#inventory-list').html('<div class="empty-tip">暂无库存，请先在添加商品中添加商品和规格</div>');
                    else {
                        var html = '<table><tr><th>商品名称</th><th>存放位置</th><th>总数量</th><th>可售数量</th><th>操作</th></tr>';
                        list.forEach(function(i) {
                            var displayName = (i.product_name || i.sku_name || '-');
                            var promptName = (i.product_name && i.sku_name) ? (i.product_name + ' ' + i.sku_name) : displayName;
                            html += '<tr data-sku-id="' + i.sku_id + '" data-warehouse="' + (i.warehouse || '默认') + '">';
                            html += '<td>' + displayName + '</td>';
                            html += '<td>' + (i.warehouse || '默认') + '</td>';
                            html += '<td>' + (i.quantity || 0) + '</td>';
                            html += '<td>' + (i.available_quantity || 0) + '</td>';
                            html += '<td>';
                            html += '<button type="button" class="btn-edit-inventory" data-sku-id="' + i.sku_id + '" data-warehouse="' + (i.warehouse || '默认') + '" data-quantity="' + (i.quantity || 0) + '" data-sku-name="' + (promptName || '').replace(/"/g, '&quot;') + '" style="background:#4caf50;color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;margin-right:5px;">编辑</button>';
                            html += '<button type="button" class="btn-delete-inventory" data-sku-id="' + i.sku_id + '" data-warehouse="' + (i.warehouse || '默认') + '" data-sku-name="' + (promptName || '').replace(/"/g, '&quot;') + '" style="background:#f44336;color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;">删除</button>';
                            html += '</td></tr>';
                        });
                        html += '</table>';
                        $('#inventory-list').html(html);
                    }
                } else $('#inventory-list').html('<div class="empty-tip">' + (r.error || '加载失败') + '</div>');
            },
            error: function(xhr) {
                var msg = '加载失败，请检查网络或重新登录';
                if (xhr.status === 401) {
                    msg = (xhr.responseJSON && xhr.responseJSON.error) || '登录已过期，请重新登录';
                } else if (xhr.status === 403) {
                    msg = (xhr.responseJSON && xhr.responseJSON.error) || '需要商家账号登录';
                } else if (xhr.responseJSON && xhr.responseJSON.error) {
                    msg = xhr.responseJSON.error;
                } else if (xhr.status === 0) {
                    msg = '无法连接服务器，请确认服务已启动';
                }
                $('#inventory-list').html('<div class="empty-tip">' + msg + '</div>');
            }
        });
        
        // 编辑库存
        $(document).off('click', '.btn-edit-inventory').on('click', '.btn-edit-inventory', function() {
            var $btn = $(this);
            var skuId = $btn.data('sku-id');
            var warehouse = $btn.data('warehouse');
            var quantity = $btn.data('quantity');
            var skuName = $btn.data('sku-name');
            
            var newQuantity = prompt('请输入新的库存数量（商品：' + skuName + '，位置：' + warehouse + '）：', quantity);
            if (newQuantity === null) return;
            
            newQuantity = parseInt(newQuantity);
            if (isNaN(newQuantity) || newQuantity < 0) {
                alert('请输入有效的数量');
                return;
            }
            
            $btn.prop('disabled', true).text('保存中...');
            $.ajax({
                url: baseUrl + '/v1/supplier/inventory/update',
                type: 'POST',
                headers: { 'Authorization': token, 'Content-Type': 'application/json' },
                data: JSON.stringify({
                    sku_id: skuId,
                    warehouse: warehouse,
                    quantity: newQuantity
                }),
                success: function(r) {
                    if (r.code === 200) {
                        alert('更新成功');
                        location.reload();
                    } else {
                        alert(r.error || '更新失败');
                        $btn.prop('disabled', false).text('编辑');
                    }
                },
                error: function(xhr) {
                    var msg = '更新失败';
                    if (xhr.responseJSON && xhr.responseJSON.error) {
                        msg = xhr.responseJSON.error;
                    }
                    alert(msg);
                    $btn.prop('disabled', false).text('编辑');
                }
            });
        });
        
        // 删除库存
        $(document).off('click', '.btn-delete-inventory').on('click', '.btn-delete-inventory', function() {
            var $btn = $(this);
            var skuId = $btn.data('sku-id');
            var warehouse = $btn.data('warehouse');
            var skuName = $btn.data('sku-name');
            
            if (!confirm('确定要删除库存记录吗？\n商品：' + skuName + '\n位置：' + warehouse)) return;
            
            $btn.prop('disabled', true).text('删除中...');
            $.ajax({
                url: baseUrl + '/v1/supplier/inventory/delete',
                type: 'POST',
                headers: { 'Authorization': token, 'Content-Type': 'application/json' },
                data: JSON.stringify({
                    sku_id: skuId,
                    warehouse: warehouse
                }),
                success: function(r) {
                    if (r.code === 200) {
                        alert('删除成功');
                        $btn.closest('tr').fadeOut(300, function() { $(this).remove(); });
                    } else {
                        alert(r.error || '删除失败');
                        $btn.prop('disabled', false).text('删除');
                    }
                },
                error: function(xhr) {
                    var msg = '删除失败';
                    if (xhr.responseJSON && xhr.responseJSON.error) {
                        msg = xhr.responseJSON.error;
                    }
                    alert(msg);
                    $btn.prop('disabled', false).text('删除');
                }
            });
        });
        }
    </script>
<script src="/static/js/reservation-policy.js?v=20261022-stock"></script>
</body>
</html>
