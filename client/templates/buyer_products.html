<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="procure_title">Product Procurement - tea_saas</title>
    <link href="../static/css/design-tokens.css" rel="stylesheet">
    <link href="../static/css/rtl.css" rel="stylesheet">
    <link href="../static/css/buyer-workbench.css?v=20261018-trace-disabled" rel="stylesheet">
    <script src="../static/js/init.js"></script>
    <script src="../static/js/auth-storage.js?v=20261018-session-isolation"></script>
    <script src="../static/js/jquery-3.1.1.min.js"></script>
{% include "shared/system_theme.html" %}
    <link rel="stylesheet" href="/static/css/store-pages.css?v=1">
    <link rel="stylesheet" href="/static/css/buyer-discovery.css?v=20261021-filters">
    <script src="/static/js/storefront.js?v=20261022-cny"></script>
</head>
<body class="ds-page-buyer_products ds-theme buyer-workbench" id="buyer-body">
    <div class="buyer-layout">
        {% include 'buyer_sidebar.html' with active='products' %}

        <main class="buyer-main">
            {% include 'buyer_header.html' %}

            <div class="buyer-content">
                <div class="procurement-heading">
                    <p class="procurement-eyebrow">TEA COLLECTION</p>
                    <h1 data-procure="title">商品采购</h1>
                    <p data-procure="intro">按茶类、价格与店铺查找商品，核对规格后加入采购车。</p>
                </div>

                <!-- 分类标签 + 商品列表 -->
                <section class="products-section">
                    <div class="category-tabs" id="category-tabs">
                        <span class="cat-loading" data-i18n="loading">Loading...</span>
                    </div>
                    <form id="procurement-filters" class="procurement-filters">
                        <fieldset id="procurement-fields" disabled>
                            <legend class="sr-only" data-procure="apply">应用筛选</legend>
                            <label class="procurement-keyword"><span data-procure="keyword">商品关键词</span><input id="filter-q" name="q" type="search" maxlength="200" placeholder="商品名、规格或店铺名" aria-label="商品关键词"></label>
                            <label><span><span data-procure="min_price">最低价格</span> (<span data-price-currency>CNY</span>)</span><input id="filter-min_price" name="min_price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="最低价格 (CNY)" aria-label="最低价格 (CNY)"></label>
                            <label><span><span data-procure="max_price">最高价格</span> (<span data-price-currency>CNY</span>)</span><input id="filter-max_price" name="max_price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="最高价格 (CNY)" aria-label="最高价格 (CNY)"></label>
                            <label class="procurement-store"><span data-procure="merchant">店铺名称</span><input id="filter-store_q" name="store_q" type="search" maxlength="200" placeholder="搜索店铺名称" aria-label="搜索店铺名称"></label>
                            <label><span data-procure="sort">排序</span><select id="filter-sort" name="sort" aria-label="排序"><option value="default" data-procure="default_sort">茶类均衡</option><option value="price_asc" data-procure="price_asc">价格从低到高</option><option value="price_desc" data-procure="price_desc">价格从高到低</option></select></label>
                            <div class="procurement-filter-actions"><button type="submit" class="btn-add-cart" data-procure="apply">应用筛选</button><button id="procurement-reset" type="button" class="catalog-tab" data-procure="reset">重置</button></div>
                        </fieldset>
                    </form>
                    <p class="procurement-note" data-procure="note">仅展示可售商品；价格为参考换算，最终金额以结算页为准。</p>
                    <div id="procurement-results">
                    <p class="featured-summary" id="procurement-summary" aria-live="polite"></p>
                    <p id="procurement-error" role="alert" data-procure="error" hidden>商品目录加载失败，请重试。</p>
                    <button id="procurement-retry" type="button" class="catalog-tab" data-procure="retry" hidden>重新加载</button>
                    <p id="procurement-empty" role="status" data-procure="empty" hidden>没有符合条件的商品，请调整筛选。</p>
                    <div class="product-grid" id="product-grid">
                        <div class="product-loading" data-i18n="loading">Loading...</div>
                    </div>
                    <nav class="procurement-pagination" id="procurement-pagination" aria-label="商品分页" hidden></nav>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div class="modal-preview" id="modal-preview" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="modal-preview-title">
        <div class="modal-backdrop" data-close="1"></div>
        <div class="modal-card">
            <button type="button" class="modal-close" data-close="1" aria-label="close">×</button>
            <h3 id="modal-preview-title" data-i18n="preview_title">快速预览</h3>
            <p class="modal-body" id="modal-preview-body"></p>
        </div>
    </div>
    <script src="../static/js/buyer-catalog-model.js?v=20261022-cny"></script>
    <script src="../static/js/buyer-workbench.js?v=20261022-account-menu"></script>
    <script src="../static/js/buyer-products.js?v=20261022-cny"></script>
</body>
</html>
