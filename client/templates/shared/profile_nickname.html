<div class="ba-form-row" id="nickname-editor" aria-busy="true">
    <label for="pf-nickname" data-nickname-text="label">昵称</label>
    <input type="text" id="pf-nickname" maxlength="60" autocomplete="nickname" aria-describedby="nickname-hint nickname-msg" disabled>
    <p class="ba-hint" id="nickname-hint" data-nickname-text="hint">最多30个字符，可重名。用于咨询时展示；清空后显示默认脱敏名称，登录账号不变。</p>
    <button type="button" id="nickname-save" class="ba-btn-primary" disabled data-nickname-text="save">保存昵称</button>
    <p class="ba-msg" id="nickname-msg" role="status" aria-live="polite">正在加载昵称…</p>
</div>
