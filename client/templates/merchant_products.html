<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理 - tea_saas</title>
    <link rel="icon" href="/static/images/index/py.ico">
    <link href="/static/css/index.css" rel="stylesheet" />
    <link href="/static/css/theme.css" rel="stylesheet" />
    <link href="/static/css/merchant_workbench.css" rel="stylesheet" />
    <link href="/static/css/merchant_products.css?v=20261018-merchant-preview" rel="stylesheet" />
    <script src="/static/js/init.js"></script>
    <script src="/static/js/auth-storage.js?v=20261018-session-isolation"></script>
    <script src="/static/js/jquery-3.1.1.min.js"></script>
    <script>
        if (window.location.search.indexOf('embed=1') >= 0 || window.self !== window.top) {
            document.documentElement.classList.add('embed-mode');
        }
    </script>
    <script src="/static/js/merchant-product-preview.js?v=20261018-merchant-preview" defer></script>
    <script src="/static/js/merchant_products.js?v=20261018-merchant-preview" defer></script>
{% include "shared/system_theme.html" %}
</head>
<body class="ds-page-merchant_products ds-theme merchant-body">
    <header class="merchant-header-brand">
        <div class="brand-container">
            <img src="/static/images/logo/1.jpg" alt="tea_saas" class="brand-logo-img" />
            <span class="brand-separator">·</span>
            <span class="brand-subtitle">供应商工作台</span>
        </div>
    </header>

    <div class="merchant-wrap">
        <nav class="merchant-nav">
            <ul>
                <li><a href="merchant_dashboard.html">工作台首页</a></li>
                <li><a href="merchant_products.html" class="active">商品管理</a></li>
                <li><a href="merchant_orders.html">订单管理</a></li>
                <li><a href="merchant_inventory.html">库存查看</a></li>
                <li><a href="#" id="btn-logout">退出登录</a></li>
            </ul>
        </nav>

        <!-- 商品列表（默认） -->
        <div class="mp-wrap" id="view-list">
            <div class="mp-topbar">
                <h1 class="mp-title">商品管理</h1>
                <div class="mp-actions">
                    <a class="btn btn-primary" href="merchant_products.html?mode=create">新增商品</a>
                </div>
            </div>

            <div class="card">
                <div class="card-pad">
                    <div class="filter-grid">
                        <div class="field" style="grid-column: 1 / -1;">
                            <label>全局搜索</label>
                            <input id="flt-q" type="search" placeholder="搜索商品名称" autocomplete="off">
                        </div>
                        <div class="field">
                            <label>库存状态</label>
                            <select id="flt-status">
                                <option value="all">全部</option>
                                <option value="good">库存充足（>100）</option>
                                <option value="low">库存紧张（<=100）</option>
                                <option value="none">库存无（=0）</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>分类</label>
                            <select id="flt-cat1"></select>
                        </div>
                        <div class="field" style="align-self: end; display:flex; gap:8px; justify-content:flex-end;">
                            <button type="button" class="btn" id="btn-reset">重置</button>
                            <button type="button" class="btn btn-primary" id="btn-search">筛选</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-pad bulk">
                    <div class="bulk-left">
                        <span class="muted">批量操作</span>
                        <button type="button" class="btn" id="b-on">批量上架</button>
                        <button type="button" class="btn" id="b-off">批量下架</button>
                        <button type="button" class="btn" id="b-del">批量删除</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-pad" style="padding-top:0;">
                    <div class="pagination" style="padding: 10px 0;">
                        <div class="muted" id="mp-total">共 0 条</div>
                        <div class="page-bts">
                            <button type="button" class="btn" id="btn-prev">上一页</button>
                            <span class="muted" id="mp-page">第 1 / 1 页</span>
                            <button type="button" class="btn" id="btn-next">下一页</button>
                        </div>
                    </div>
                    <div style="overflow-x:auto;">
                        <table class="table">
                            <thead>
                            <tr>
                                <th style="width:44px;"><input type="checkbox" disabled title="全选"></th>
                                <th style="width:80px;">图片</th>
                                <th>商品</th>
                                <th>分类</th>
                                <th>库存</th>
                                <th>售价(USD)</th>
                                <th>库存状态</th>
                                <th>上架状态</th>
                                <th>创建时间</th>
                                <th style="min-width:220px;">操作</th>
                            </tr>
                            </thead>
                            <tbody id="mp-table-body"></tbody>
                        </table>
                    </div>
                    <div class="pagination" style="padding: 10px 0 0;">
                        <div class="muted" id="mp-total-2">第 1 / 1 页</div>
                        <div class="page-bts">
                            <button type="button" class="btn" id="btn-prev-2">上一页</button>
                            <button type="button" class="btn" id="btn-next-2">下一页</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 新增商品（?mode=create） -->
        <div class="mp-wrap" id="view-create" style="display:none;">
            <div class="mp-topbar">
                <h1 class="mp-title">新增商品</h1>
                <div class="mp-actions">
                    <a class="btn" href="merchant_products.html">返回列表</a>
                </div>
            </div>

            <div class="card">
                <div class="card-pad">
                    <div class="form-grid-2">
                        <div class="field">
                            <label>所属分类 *</label>
                            <select id="c-catalog"></select>
                        </div>
                        <div class="field">
                            <label>品牌</label>
                            <input id="c-brand" type="text" maxlength="20">
                        </div>
                    </div>
                    <div class="field">
                        <label>商品名称 *</label>
                        <input id="c-spu-name" type="text" maxlength="50">
                    </div>
                    <div class="field">
                        <label>商品介绍</label>
                        <textarea id="c-introduction" maxlength="100" rows="3" placeholder="介绍这款茶的特点"></textarea>
                    </div>
                    <div class="form-grid-3">
                        <div class="field">
                            <label>单价 *</label>
                            <input id="c-price" type="number" step="0.01" min="0" value="0">
                        </div>
                        <div class="field">
                            <label>库存数量 *</label>
                            <input id="c-stock" type="number" min="0" step="1" value="0">
                        </div>
                        <div class="field">
                            <label>是否上架销售</label>
                            <select id="c-launched">
                                <option value="true">是</option>
                                <option value="false">否</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-grid-2">
                        <div class="field">
                            <label>商品主图（可选）</label>
                            <input id="c-image" type="file" accept="image/*">
                        </div>
                        <div class="field">
                            <label>预览</label>
                            <div style="display:flex;align-items:center;gap:10px;">
                                <img id="c-img-preview" class="thumb" src="/static/images/cart/product_normal.png" alt="">
                            </div>
                        </div>
                    </div>
                    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:12px;">
                        <button type="button" class="btn" id="btn-create-reset">重置</button>
                        <button type="button" class="btn btn-primary" id="btn-create-submit">创建商品</button>
                    </div>
                    <div class="badge-err" id="create-err" style="margin-top:10px;"></div>
                </div>
            </div>
        </div>

        <!-- 商品编辑 -->
        <div class="mp-wrap" id="view-edit" style="display:none;">
            <div class="mp-topbar">
                <h1 class="mp-title" id="mp-edit-title">商品编辑</h1>
                <div class="mp-actions">
                    <a class="btn" href="merchant_products.html">返回列表</a>
                </div>
            </div>

            <div class="edit-layout">
                <div>
                    <div class="card">
                        <div class="card-pad">
                            <div id="panel-basic" class="panel active">
                                <div class="form-grid-2">
                                    <div class="field">
                                        <label>所属分类 *</label>
                                        <select id="f-catalog"></select>
                                    </div>
                                    <div class="field">
                                        <label>品牌</label>
                                        <input id="f-brand" type="text" maxlength="20">
                                    </div>
                                </div>
                                <div class="field">
                                    <label>商品名称 *</label>
                                    <input id="f-spu-name" type="text" maxlength="50">
                                </div>
                                <input id="f-sku-id" type="hidden">
                                <div class="field">
                                    <label>商品介绍</label>
                                    <textarea id="f-introduction" maxlength="100" rows="3" placeholder="介绍这款茶的特点"></textarea>
                                </div>
                                <div class="form-grid-3">
                                    <div class="field">
                                        <label>单价 *</label>
                                        <input id="f-price" type="number" step="0.01" min="0">
                                    </div>
                                    <div class="field">
                                        <label>库存数量 *</label>
                                        <input id="f-stock" type="number" min="0" step="1">
                                    </div>
                                    <div class="field">
                                        <label>是否上架销售</label>
                                        <select id="f-launched">
                                            <option value="true">是</option>
                                            <option value="false">否</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-grid-2">
                                    <div class="field">
                                        <label>上传商品图片</label>
                                        <input id="f-image" type="file" accept="image/*">
                                    </div>
                                    <div class="field">
                                        <label>当前图片</label>
                                        <div style="display:flex;align-items:center;gap:10px;">
                                            <img id="f-cur-img" class="thumb" src="/static/images/cart/product_normal.png" alt="">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="sticky-bottom">
                                <div class="statusbar"></div>
                                <div class="mp-actions" style="justify-content:flex-end;">
                                    <button type="button" class="btn" id="btn-preview">预览</button>
                                    <button type="button" class="btn btn-primary" id="btn-save-primary">保存</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 无 token 禁止访问
        (function() {
            if (typeof AuthStorage === 'undefined') return;
            if (!AuthStorage.getToken()) {
                alert('请先登录');
                location.href = 'login.html';
            }
        })();
    </script>

    <footer class="merchant-footer">tea_saas · 中国地标茶出海中东 © 2026</footer>
</body>
</html>
