<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>账户设置 · 跨境茶叶saas平台</title>
    <link rel="icon" href="/static/images/index/py.ico">
    <link rel="stylesheet" href="/static/css/design-tokens.css">
    <link rel="stylesheet" href="/static/css/rtl.css">
    <link rel="stylesheet" href="/static/css/buyer-workbench.css?v=20261003-account">
    <link rel="stylesheet" href="/static/css/buyer-account.css?v=20261003-account">
    <script src="/static/js/init.js"></script>
    <script src="/static/js/auth-storage.js?v=20261018-session-isolation"></script>
    <script src="/static/js/jquery-3.1.1.min.js"></script>
{% include "shared/system_theme.html" %}
</head>
<body class="ds-page-buyer_password ds-theme buyer-workbench buyer-account-page ba-password-page" id="buyer-body">
    <div class="buyer-layout">
        {% include 'buyer_sidebar.html' with active='profile' %}

        <main class="buyer-main">
            {% include 'buyer_header.html' %}

            <div class="buyer-content ba-content">
                <div class="ba-page-head">
                    <span class="ba-eyebrow">BUYER WORKBENCH</span>
                    <h1 data-i18n="menu_settings">账户设置</h1>
                    <p>修改登录密码，保障账户安全。</p>
                </div>

                <section class="ba-panel active">
                    <form id="password-form" novalidate>
                        <div class="ba-form-row">
                            <label for="pwd-old">当前密码</label>
                            <input type="password" id="pwd-old" minlength="6" maxlength="12" required autocomplete="current-password">
                        </div>
                        <div class="ba-form-row">
                            <label for="pwd-new">新密码</label>
                            <input type="password" id="pwd-new" minlength="6" maxlength="12" required autocomplete="new-password">
                            <p class="ba-hint">6–12 位字符</p>
                        </div>
                        <div class="ba-form-row">
                            <label for="pwd-confirm">确认新密码</label>
                            <input type="password" id="pwd-confirm" minlength="6" maxlength="12" required autocomplete="new-password">
                        </div>
                        <div class="ba-actions">
                            <button type="submit" class="ba-btn-primary">保存新密码</button>
                            <a class="ba-btn-link" href="buyer_profile.html">返回个人信息</a>
                        </div>
                        <p class="ba-msg" id="password-msg" aria-live="polite"></p>
                    </form>
                </section>
            </div>

            <footer class="ba-footer">© 2026 跨境茶叶saas平台 · 中国地标茶出海中东</footer>
        </main>
    </div>

    <script src="/static/js/buyer-workbench.js?v=20261018-platform-name"></script>
    <script src="/static/js/buyer-password.js?v=20261003-account"></script>
</body>
</html>
