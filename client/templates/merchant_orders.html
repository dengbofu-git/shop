<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>订单管理 - tea_saas</title>
    <link href="../static/css/index.css" rel="stylesheet" />
    <link href="../static/css/theme.css" rel="stylesheet" />
    <link href="../static/css/merchant_workbench.css" rel="stylesheet" />
    <style>
        /* 确保品牌标题样式生效 */
        .merchant-header-brand {
            max-width: 1200px !important;
            margin: 20px auto !important;
            padding: 20px !important;
            text-align: center !important;
        }
        .brand-container {
            display: inline-flex !important;
            align-items: center !important;
            gap: 12px !important;
            padding: 16px 32px !important;
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(241,248,233,0.95)) !important;
            border-radius: 12px !important;
            box-shadow: 0 4px 20px rgba(27,94,32,0.15), 0 0 0 1px rgba(46,125,50,0.1), inset 0 1px 0 rgba(255,255,255,0.8) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            transition: all 0.3s ease !important;
            animation: brandEntrance 0.6s ease-out !important;
        }
        .brand-title {
            font-size: 28px !important;
            font-weight: 700 !important;
            color: #2e7d32 !important;
            letter-spacing: 2px !important;
        }
        .brand-separator {
            font-size: 24px !important;
            color: #81c784 !important;
            opacity: 0.6 !important;
        }
        .brand-subtitle {
            font-size: 22px !important;
            font-weight: 600 !important;
            color: #558b2f !important;
            letter-spacing: 1px !important;
        }
        @keyframes brandEntrance {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script src="../static/js/init.js"></script>
    <script src="../static/js/auth-storage.js?v=20261018-session-isolation"></script>
    <script src="../static/js/jquery-3.1.1.min.js"></script>
    <script>
        if (window.location.search.indexOf('embed=1') >= 0 || window.self !== window.top) {
            document.documentElement.classList.add('embed-mode');
        }
    </script>
    <style>
        html.embed-mode .merchant-header-brand,
        html.embed-mode .merchant-nav,
        html.embed-mode .merchant-footer { display: none !important; }
        html.embed-mode .merchant-wrap { margin-top: 0; }
        html.embed-mode body.merchant-body { background: #f1f8e9 !important; }
    </style>
{% include "shared/system_theme.html" %}
    <link href="../static/css/merchant-orders.css?v=20261019-status-filters" rel="stylesheet" />
</head>
<body class="ds-page-merchant_orders ds-theme merchant-body">
    <header class="merchant-header-brand">
        <div class="brand-container">
            <img src="../static/images/logo/1.jpg" alt="tea_saas" class="brand-logo-img" />
            <span class="brand-separator">·</span>
            <span class="brand-subtitle">供应商工作台</span>
        </div>
    </header>

    <div class="merchant-wrap">
        <nav class="merchant-nav">
            <ul>
                <li><a href="merchant_dashboard.html">工作台首页</a></li>
                <li><a href="merchant_products.html">添加商品</a></li>
                <li><a href="merchant_orders.html" class="active">订单管理</a></li>
                <li><a href="merchant_inventory.html">库存查看</a></li>
                <li><a href="#" id="btn-logout">退出登录</a></li>
            </ul>
        </nav>
        <div class="merchant-content">
            <h3>我的订单</h3>
            <div id="order-status-filters" class="order-status-filters" role="group" aria-label="按订单状态筛选"></div>
            <p id="order-summary" class="order-summary" role="status" aria-live="polite">正在加载订单…</p>
            <div id="order-list" class="order-table-scroll" tabindex="0" role="region" aria-label="商家订单列表" aria-busy="true"></div>
        </div>
    </div>

    <footer class="merchant-footer">tea_saas · 中国地标茶出海中东 © 2026</footer>

    <script src="../static/js/merchant-orders.js?v=20261019-status-filters"></script>
