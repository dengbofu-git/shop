name: tea_saas-agent-observability

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13134:13133"
    depends_on: [jaeger]

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    restart: unless-stopped
    command: ["--config=/etc/jaeger/config.yaml"]
    volumes:
      - ./deploy/observability/jaeger.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"

volumes:
  prometheus_data:
    name: ${AGENT_PROMETHEUS_VOLUME_NAME:-tea_saas-agent-observability_prometheus_data}
